name: Release desktop installer

on:
  push:
    tags:
      - "v*"
    # Pushes to main only build and upload the installer as a workflow artifact; publishing needs a v* tag.
    branches:
      - main
    # Path filters apply to branch pushes only; tag pushes always build.
    paths-ignore:
      - "**.md"
      - "ticketly/**"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without v), used for test builds that are not published; pushes to main build 0.0.0"
        required: true
        default: "0.0.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # A newer push to main supersedes a running test build; tag builds always finish.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.event.inputs.version || '0.0.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            desktop/requirements.txt

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static frontend
        run: pnpm exec next build
        env:
          DESKATLAS_STATIC: "1"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r desktop/requirements.txt

      - name: Stamp version
        shell: bash
        run: echo "VERSION = \"${{ steps.version.outputs.value }}\"" > backend/app/_build_version.py

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Generate icon
        run: python installer/make_icon.py

      - name: Build application with PyInstaller
        run: python -m PyInstaller installer/deskatlas.spec --noconfirm --clean

      - name: Smoke test the bundle
        shell: pwsh
        run: |
          $exe = "dist\DeskAtlas\DeskAtlas.exe"
          if (-not (Test-Path $exe)) { throw "bundle missing" }
          if (-not (Test-Path "dist\DeskAtlas\_internal\static\index.html")) { throw "static site missing from bundle" }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=${{ steps.version.outputs.value }}" installer\DeskAtlas.iss
          Get-ChildItem dist\*.exe

      - name: Write signed update manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          DESKATLAS_UPDATE_PRIVATE_KEY: ${{ secrets.DESKATLAS_UPDATE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          # Notes come from the annotated tag message (a lightweight tag falls back to the commit message).
          # They are shown in the tray panel and on the release page, so write them in Chinese.
          # checkout only leaves a lightweight copy of the tag, so fetch the tag object first.
          git fetch --force --no-tags origin "+refs/tags/v$VERSION:refs/tags/v$VERSION"
          git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "v$VERSION" > dist/notes.md
          python scripts/make_update_manifest.py \
            --version "$VERSION" \
            --installer "dist/DeskAtlas-Setup-$VERSION.exe" \
            --url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VERSION/DeskAtlas-Setup-$VERSION.exe" \
            --notes-file dist/notes.md \
            --output dist/latest.json

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeskAtlas-${{ steps.version.outputs.value }}
          path: |
            dist/DeskAtlas-Setup-*.exe
            dist/latest.json
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: DeskAtlas ${{ steps.version.outputs.value }}
          body_path: dist/notes.md
          files: |
            dist/DeskAtlas-Setup-${{ steps.version.outputs.value }}.exe
            dist/latest.json
