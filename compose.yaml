services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-deskatlas}
      POSTGRES_USER: ${POSTGRES_USER:-deskatlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-deskatlas}
    ports:
      - "55432:5432"
    volumes:
      - deskatlas-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-deskatlas} -d ${POSTGRES_DB:-deskatlas}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-deskatlas}:${POSTGRES_PASSWORD:-deskatlas}@db:5432/${POSTGRES_DB:-deskatlas}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 4s
      retries: 10

  web:
    build:
      context: .
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  deskatlas-db:
